# =============================================================================
# store deploy — TOON connector (payment proxy) in front of the Arweave store
# =============================================================================
# BAKED into the store-connector image at /app/config/connector.toml (see
# deploy/Dockerfile) — NOT bind-mounted. TLS is terminated by the deployment
# environment (no Caddy in this compose).
#
# Topology (one box, one app — the shape the TOON devnet store box runs):
#
#   payer ──POST /ilp (3000)──▶ connector ──POST /store──▶ store:3300  (job backend; PRIVATE)
#                                (terminates the payment)   (payment-oblivious)
#                                                           └─ uploads the blob, returns {txId}
#
# - The connector's client edge is `POST /ilp` (and `GET /ilp/btp` for a BTP
#   session). A paid, claim-gated packet addressed to one of the prefixes below
#   terminates here and is delivered to `handler_url`; the store's `{txId}`
#   response comes back in the FULFILL. The store never sees ILP or settlement —
#   it is a payment-oblivious `POST /store` backend and nothing else.
# - An UNPAID packet is answered with x402 terms and never reaches the store.
#
# ── This is the RUST connector's TOML (ADR 0001/0009) ────────────────────────
# It replaces the TypeScript connector's `connector.yaml`. Three consequences
# worth reading before editing:
#
#   1. There is NO environment-variable layer. Every value comes from this
#      file; `${...}` is not interpolated and `TOON_MNEMONIC` no longer does
#      anything. Identity is a KEY FILE mounted into the container (below).
#   2. The parser is `deny_unknown_fields`. A leftover YAML-ism — `nodeId`,
#      `adminApi`, `selfAnnounce`, `settlementAddresses`, `nextHop` — is a hard
#      config-load error, not a silently ignored key. That is deliberate.
#   3. Startup is FAIL-CLOSED: a missing key file, an unwritable `state_dir`,
#      or a settlement registry that will not resolve the token is exit 1 with
#      the reason, never a degraded run.
#
# ── What did NOT survive the port, and why ───────────────────────────────────
# The old YAML was stale beyond its format, so this is a rewrite against the
# live wiring rather than a transliteration:
#
#   * `g.proxy` was RENAMED to `g.toon`. Every prefix below moved.
#   * The store app's own advertised prefix is `g.toon.ario` (Arweave), which is
#     what the fleet's announcements point clients at and what published clients
#     actually dial. `g.toon.store` is kept as an alias at the same price.
#   * The old file described a `relay-connector` peer that "ABSORBS the g.proxy
#     apex role" and an OUTBOUND-ONLY forward route existing solely so this box
#     could pay the apex to publish its own kind:10032 announcement. All of that
#     is gone: the Rust connector has NO self-announce feature (no such field
#     exists in `crates/connector-config`; writing one fails config load), so
#     the route that existed to carry it has nothing left to carry.
#   * No `[[peers]]`, deliberately. The live fleet's node↔node links are PUBLIC
#     and TLS-terminated by each box's own nginx — the apex reaches this store
#     app the way any client on the open internet does, by terminating a route
#     at this box's public `/store` front. This node accepts no inbound peering
#     and dials none; it is a client-edge-only connector. See the commented
#     block at the bottom for what adding a peering would take.
# =============================================================================

# The client edge: POST /ilp, GET /ilp/btp, GET /ilp/identity, the operator
# surface and /metrics all share this ONE port (there is no separate admin or
# health port — the TypeScript node's 8080/8081 do not exist here). 0.0.0.0 so
# the compose port publish reaches it.
client_edge_addr = "0.0.0.0:3000"

# ── Durable claim state (connector#605) ──────────────────────────────────────
# The append-only claim journals — `client-edge-claims.log`, `peer-claims.log` —
# whose replay is what makes a channel's replay watermark survive a restart.
# Without it every watermark lives in process memory, so a restart resets each
# channel to "no claim ever seen" and a channel with no watermark accepts any
# nonce: every claim a client already spent becomes free service again.
#
# MUST be a mounted volume, not a path in the container's writable layer — see
# the `connector_state` named volume in docker-compose.yml. The image ships
# /app/state owned by uid 10001, which is what a fresh NAMED volume inherits on
# first mount; a host bind mount inherits nothing and needs `chown 10001:10001`.
# The image must be built from connector 63b8188a or later for a FRESH named
# volume to be writable at all — every `rust-sha-` tag published since is well
# past it, so this constrains rolling BACK, not rolling forward.
state_dir = "/app/state"

# ── Signer (ADR 0012) ────────────────────────────────────────────────────────
# A LOCATION, never the key itself. 32 raw bytes or 64 hex characters encoding a
# secp256k1 secret key. This is the connector's own ILP signing identity — it
# holds no money and should be fresh random material per box:
#
#   openssl rand -hex 32 > deploy/signer.key
#   chmod 600 deploy/signer.key
#   chown 10001:10001 deploy/signer.key     # the image runs as uid 10001
#
# A bind-mounted file keeps its HOST ownership inside the container, so a
# root-owned 0600 key is unreadable to the process that needs it and the
# container restart-loops on "Permission denied". The chown is the fix; do not
# reach for chmod 644.
[signer]
key_file = "/app/data/signer.key"

# ── Routes ───────────────────────────────────────────────────────────────────
# Static, explicit, durable (ADR 0006). All three prefixes terminate at the SAME
# payment-oblivious store app, at the SAME price — the live store box terminates
# exactly these three, for exactly these reasons:
#
#   g.toon.ario        this box's own advertised prefix (Arweave); what the
#                      fleet's kind:10032 announcements point clients at.
#   g.toon.relay.ario  the relay-hop form (client → apex → here).
#   g.toon.store       the alias the apex's own `g.toon.store` route forwards
#                      to, kept so a client arriving directly at this edge is
#                      priced identically.
#
# `/store`, NOT the bare origin: `HttpAppClient::deliver` POSTs to exactly this
# URL and the store app serves only `POST /store` (its HTTP backend endpoint,
# HANDLER_PORT=3300) and `GET /health` on its separate health port. A bare
# `http://store:3300` comes back F99 "app declined the delivery with HTTP 404".
# A sender's own envelope `target` is resolved strictly BENEATH this path, never
# in place of it (connector#596, ADR 0025).
#
# The prices MUST stay equal to each other. `insert_consistent_handler_price`
# refuses a config where one handler_url is reachable at two prices — the
# cheaper door would take every packet, which is an arbitrage between two doors
# into one handler, not a discount.
#
# `1000` is 0.001 USDC in the smallest unit of the settlement asset (6-decimal
# USDC everywhere — ADR 0010), the flat per-object figure the fleet quotes for a
# store upload. `price` is REQUIRED on a terminated route (connector#520) — it
# is never silently free; write `price = 0` if free is what you mean. Keep it
# non-zero to keep the x402 greeting armed (connector#552/#557).
#
# `transport` is left at its default (`both`: HTTP one-shot AND BTP session), on
# purpose. A store write is a one-shot request from an arbitrary buyer, so
# unlike the apex's relay leg — pinned `transport = "btp"` for huddles'
# persistent 49 fps sessions (connector#701) — there is nothing here to amortize
# a handshake against, and a stranger doing one upload should not need a
# session.

[[routes]]
prefix = "g.toon.ario"
handler_url = "http://store:3300/store"
price = 1000

[[routes]]
prefix = "g.toon.relay.ario"
handler_url = "http://store:3300/store"
price = 1000

[[routes]]
prefix = "g.toon.store"
handler_url = "http://store:3300/store"
price = 1000

# ── Settlement (ADR 0009, connector#542/#556) ────────────────────────────────
# What makes this node able to ACCEPT money. With this section, an unaffiliated
# buyer who opens a channel on chain pays this node with no config edit
# (connector#611) and the accepted claim's watermark is journaled under
# `state_dir` above. WITHOUT it — and without a `[[client_channels]]` table
# naming every channel by hand — this node has a record of no channel, so every
# claim at its client edge is refused as unknown and every channel operation on
# the operator surface answers 503.
#
# FAIL-CLOSED, and it is worth knowing which way: startup calls
# `EvmSettlementBackend::connect`, which resolves `token_address` through the
# registry at `contract_address` and reads the token's own `decimals()`. A wrong
# RPC URL, a registry that does not answer `getTokenNetwork(token)`, or a
# `decimals` that disagrees with the chain is an exit 1 AT STARTUP, not a
# runtime surprise (connector#564/#566). Every chain table you add here is one
# more endpoint this node must reach before it will boot at all.
#
# The values below are the SHARED TOON DEVNET's deployment — the same registry,
# token and decimals both live boxes settle through. A claim this node accepts
# is written against the channel the buyer opened on those contracts, so a node
# pointed at a different registry cannot resolve it. Point them elsewhere only
# if you are running your own fleet end to end.
[settlement.evm]
rpc_url = "https://base-sepolia-rpc.publicnode.com"
# The deployed TokenNetworkRegistry (a factory, not a channel contract).
contract_address = "0xcC9079adE929b168B54145f6d25262b64FAB9D5b"
# 6-decimal devnet USDC — the fleet-wide settlement asset (ADR 0010).
token_address = "0x49beE1Bca5d15Fb0963117923403F9498119a9Ce"
decimals = 6

[settlement.evm.key]
# Deliberately NOT the [signer] key above. The signer key is per-box random
# material with no funds; this one signs transactions that spend real testnet
# value, and it is the identity clients open their channels against — so it is
# the one to provision from a seed you can reproduce, not from `openssl rand`.
#
# The TOON fleet derives it from its BIP-39 mnemonic at NIP-06 path
# m/44'/1237'/0'/0/0 — the NOSTR coin type, not the standard m/44'/60'. That is
# the historical reason the old `TOON_MNEMONIC` env var existed; there is no env
# layer now, so derive it outside the container and mount the resulting 64-hex
# secret here. Deriving at m/44'/60'/0'/0/0 instead yields a valid address that
# no channel was ever opened against, and a node that cannot resolve a single
# one — so verify the derived address BEFORE the first `up -d`.
#
#   chmod 600 deploy/settlement.key && chown 10001:10001 deploy/settlement.key
key_file = "/app/data/settlement.key"

# ── (Optional) Solana settlement ─────────────────────────────────────────────
# The live TOON store box settles on BOTH chains, because a node that accepts
# claims is a counterparty on whichever chain the BUYER chose — an EVM-only node
# refuses every Solana-paid write that reaches it. It is commented out here only
# because it is a second fail-closed dependency (another reachable RPC, another
# key file) that a first bring-up does not need. Uncomment both tables together
# and provision the key, or leave it off and accept EVM-only.
#
# [settlement.solana]
# rpc_url = "https://api.devnet.solana.com"
# program_id = "2aEVJ8koKD8LTZrLRSGtAtU7LBt4e7QjjCgf1kzQ7Rip"
# token_address = "xyc5J8MgKFiEN13PnfftdXxUzYH34FEvw1LCrFwN7in"
# decimals = 6
#
# [settlement.solana.key]
# # A 32-byte ed25519 seed as 64 hex characters. The fleet derives it from the
# # same mnemonic at m/44'/501'/0'/0'.
# key_file = "/app/data/settlement-solana.key"

# ── (Optional) Operator surface (ADR 0008) ───────────────────────────────────
# Omitted deliberately: enabling it means committing — or securely injecting —
# a real bearer_token and write_keys, which a BAKED config cannot do safely.
# Every read (peers, routes, channels, claims, exposure, identity, the audit
# log, GET /metrics) needs the token; every write (POST /packets) needs an RFC
# 9421 signature from a key on `write_keys`, and a bearer token is never
# sufficient to move value. An [operator] section with an empty bearer_token or
# no write_keys is a refuse-to-start error, never a silently open surface.
#
# If you want /metrics on this node, add the section — and stop baking this file
# into the image, or bind-mount over it.
#
# [operator]
# bearer_token = "<openssl rand -hex 32>"
# write_keys = ["<64 hex chars: an ed25519 public key>"]

# ── (Optional) Peering to an upstream node ───────────────────────────────────
# Not used by the live fleet and not needed by this bundle: the apex reaches
# this store app over the public TLS front, terminating its own route there, so
# nothing forwards INTO this box over a peering. If you do want one — e.g. to
# forward some prefix onward from here — the shape is:
#
#   peer_expose = "btp"           # open the wss:// peer listener at GET /ilp/btp
#
#   [[peers]]
#   id = "apex"                                    # both operators write the
#   endpoint = "wss://apex.example.net:443/ilp/btp" # SAME string here; an id the
#   credential = { secret = "<openssl rand -hex 32>" }  # far side lacks is
#                                                       # silently just a client
#   [[peer_channels]]
#   peer_id = "apex"
#   channel_id = "0x..."
#   counterparty_key = "0x..."
#   chain_id = 84532
#   token_network = "0x..."
#
#   [[routes]]
#   prefix = "g.toon.relay"
#   peer_id = "apex"
#   price = 4        # what THIS edge charges the client (REQUIRED — ADR 0028;
#   fee = 3          # a forwarded route is never silently free)
#                    # `price - fee` is what reaches the peer.
#
# There is NO peer port: a peer carriage rides `client_edge_addr` above (BTP on
# GET /ilp/btp, ILP-over-HTTP on POST /ilp) and the ROLE is decided by the
# credential, never by the listener.
