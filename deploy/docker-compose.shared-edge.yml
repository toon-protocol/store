# =============================================================================
# The shared-edge overlay (infra#24, infra ADR 0001, store#137)
# =============================================================================
# The devnet is moving onto one Linode, shared by the relay, store, gas
# station, workload gateway and faucet nodes, behind one shared Caddy edge
# that owns ports 80 and 443. This node keeps its own connector, keys and
# hostnames -- only its own TLS front goes away.
#
# Turned on the way the provider's HIDDEN overlay is: two lines in .env,
# together --
#
#   COMPOSE_FILE=docker-compose.yml:docker-compose.shared-edge.yml
#
# docker compose reads COMPOSE_FILE from .env itself, so every `docker
# compose` command run in this directory -- auto-apply.sh's included --
# sees the merged stack. A `.env` with no COMPOSE_FILE line runs
# docker-compose.yml alone, exactly as before this file existed.
#
# What it does:
#
#   nginx, certbot, watchtower   DISABLED (`profiles: [disabled]` -- a
#                                 profile nothing ever activates). No public
#                                 port 80 or 443 is bound by this bundle at
#                                 all; the shared edge owns both, on the
#                                 host, once. auto-apply.sh already pulls the
#                                 pinned store/connector images unattended,
#                                 so losing watchtower here costs nothing.
#   connector                    joins the external `edge-store` network
#                                 under the stable alias `store-proxy`, so
#                                 the edge can reach it at `store-proxy:4000`
#                                 for proxy.ario.${DOMAIN}. Its
#                                 127.0.0.1:4000 loopback publish from
#                                 docker-compose.yml is untouched --
#                                 bootstrap.sh and auto-apply.sh still read
#                                 it there.
#   store                        joins `edge-store` under the alias
#                                 `store-dvm`, so the edge can reach
#                                 dvm.${DOMAIN} at `store-dvm:3400`.
#
# `edge-store` (shared contract v2) is ONE OF FIVE per-node networks the edge
# project creates -- relay, gas, gateway and faucet each get their own
# (`edge-relay`, `edge-gas`, `edge-gateway`, `edge-faucet`), and Caddy alone
# joins all five. This box joins only its own. A single flat network shared
# by every node (v1 of this contract) would let this box's connector reach
# every OTHER node's connector /admin and the gateway's handover port;
# per-node networks mean only the edge itself can reach a node. v1's single
# shared network name is retired and must not appear anywhere in this bundle
# any more.
#
# See deploy/README.md "Running behind the shared edge" for the alias:port
# table this was worked out from (deploy/nginx/node.conf.template), and for
# everything nginx does today that the edge has to replicate -- the rate
# limit, the upload body-size cap and the long read timeout matter most for
# a storage node.
#
# `networks: default: {}` is repeated on both services below because ADDING
# an explicit `networks:` key to a service that otherwise gets the implicit
# default network REPLACES it rather than extending it -- so without this,
# joining `edge-store` would silently cut the connector and the store off
# from each other and from the (disabled) nginx. Same pattern as the
# provider's `docker-compose.hidden.yml`.
#
# ── mem_limit ────────────────────────────────────────────────────────────────
# MEASURED (infra#25 step 2) -- the devnet host is confirmed a 1 GB Linode
# nanode (961 MB total, ~350 MB already used by OS/Docker before any node
# starts), not the 2 GB box the first pass of this overlay assumed. Idle
# `docker stats` taken 2026-09-25 on production Linodes running the same
# images: connector 2 MB, store 39 MB. `nginx`, `certbot` and `watchtower`
# stay disabled on this box and keep their original provisional limits --
# see the per-service comments below for how each active limit was derived.
# =============================================================================

services:
  connector:
    # measured idle 2 MB on 2026-09-25 (infra#25 step 2); limit ≈4× idle.
    mem_limit: 64m
    networks:
      default: {}
      edge-store:
        aliases: [store-proxy]

  store:
    # measured idle 39 MB on 2026-09-25 (infra#25 step 2). This overlay also
    # overrides NODE_OPTIONS below to cap the store's V8 heap at 192 MB (down
    # from the base's 384m, docker-compose.yml ~:95, which assumed a 2 GB
    # host). 256m leaves ~64 MB of headroom above that 192 MB heap cap for
    # the non-heap part of the process (native modules, buffers, the process
    # itself), which the heap cap alone does not cover, on the shared 1 GB
    # nanode host.
    mem_limit: 256m
    environment:
      NODE_OPTIONS: --max-old-space-size=192
    networks:
      default: {}
      edge-store:
        aliases: [store-dvm]

  # `profiles: [disabled]` names a profile nothing ever activates (no
  # COMPOSE_PROFILES, no `--profile` flag anywhere in this repo), which is
  # how a compose overlay switches a service off: `docker compose up -d`
  # (and `config`, with no profile given) skips it entirely, rather than
  # starting it and leaving it unused.
  nginx:
    mem_limit: 32m
    profiles: [disabled]

  certbot:
    mem_limit: 32m
    profiles: [disabled]

  watchtower:
    mem_limit: 64m
    profiles: [disabled]

networks:
  # Created and owned by infra#24's edge project -- one of five per-node
  # networks it creates (shared contract v2); this node only joins its own.
  edge-store:
    external: true
