# =============================================================================
# The TOON store box — one host, five containers
# =============================================================================
#   nginx      the public TLS edge (the only thing bound to a public port)
#   connector  the payment proxy: meters + settles, then proxies to store
#   store      the job backend: POST /store -> Arweave, payment-oblivious
#   certbot    renews the certificate
#   watchtower recreates the store when its tag moves (the connector is an
#              immutable pin, bumped by commit and picked up on `up -d`)
#
#   internet ──▶ nginx :443 ──┬──▶ connector :4000 ──▶ store :3300 ──▶ Arweave
#                             └──▶ store :3400  (health)
#
# Bring it up:  ./render.sh && docker compose up -d
# See ./README.md — nothing here works without the key files and .env it lists.
# =============================================================================

name: store

services:
  # ── The payment proxy ──────────────────────────────────────────────────────
  # Published on the LOOPBACK only. nginx is what faces the internet; binding
  # this to 0.0.0.0 would put the paid edge on the public internet past ufw
  # (docker's iptables rules bypass ufw — see README § Privacy invariant).
  connector:
    # An IMMUTABLE pin. Nothing moves the fleet's old promotion pointer any
    # more (connector ADR 0068 — a node repository pins the connector it runs), so
    # the connector moves by a reviewed commit here: this tag and the matching
    # literal in src/deploy-bundle-guard.test.ts, together. README § "Bumping
    # the connector pin".
    image: ghcr.io/toon-protocol/connector:rust-2026.08.28.1
    labels:
      com.centurylinklabs.watchtower.enable: 'true'
    volumes:
      - ./connector.toml:/app/config/connector.toml:ro
      - ./signer.key:/app/data/signer.key:ro
      - ./settlement.key:/app/data/settlement.key:ro
      - ./settlement-solana.key:/app/data/settlement-solana.key:ro
      # The operator surface's two credentials — see connector.toml's
      # [operator]. The bearer token gates reads; the allowlist holds the
      # PUBLIC halves of the keys allowed to sign a write, one per line. Both
      # are written by ./render.sh from .env, so the rendered connector.toml
      # names paths and carries no credential of its own.
      - ./operator-bearer.token:/app/data/operator-bearer.token:ro
      - ./operator-write.keys:/app/data/operator-write.keys:ro
      - connector_state:/app/state
    ports:
      - '127.0.0.1:4000:4000'
    healthcheck:
      # The connector has no /health route. GET /ilp/identity is unauthenticated
      # and answers 200 only once the process is serving AND has read its signer
      # key file — `docker ps` showing "Up" proves neither.
      # 127.0.0.1, never localhost: the listener is IPv4-only, but "localhost"
      # in a container can resolve to ::1, where nothing is listening.
      test: ['CMD-SHELL', 'wget -q --spider http://127.0.0.1:4000/ilp/identity || exit 1']
      interval: 10s
      timeout: 5s
      retries: 12
      start_period: 15s
    restart: unless-stopped

  # ── The job backend ────────────────────────────────────────────────────────
  # No `ports:` at all. The connector reaches it over the compose network, and
  # nginx serves its health endpoint; nothing about it should be reachable
  # from off-box directly.
  store:
    image: ghcr.io/toon-protocol/store:release
    labels:
      com.centurylinklabs.watchtower.enable: 'true'
    environment:
      NODE_NOSTR_SECRET_KEY: ${STORE_NOSTR_SECRET_KEY:?set STORE_NOSTR_SECRET_KEY in .env (64-char hex)}
      HANDLER_PORT: '3300'
      BLS_PORT: '3400'
      FEE_PER_JOB: ${FEE_PER_JOB:-10}
      # The ONE Turbo credential (store#128): a base58 Solana secret key that
      # signs the uploads, owns them, and pays for the above-free-tier ones
      # in $ARIO on demand.
      STORE_TURBO_SOLANA_KEY: ${STORE_TURBO_SOLANA_KEY:-}
      # Per-upload $ARIO ceiling; setting it is the spend authorization.
      # Unset = free tier only, above-ceiling uploads refused by name.
      STORE_TURBO_MAX_ARIO_PER_UPLOAD: ${STORE_TURBO_MAX_ARIO_PER_UPLOAD:-}
      LOG_LEVEL: ${LOG_LEVEL:-info}
      # kind:5095 stays unregistered while its variable is empty.
      ARNS_DVM_SOLANA_SECRET_KEY: ${ARNS_DVM_SOLANA_SECRET_KEY:-}
      ARNS_NETWORK: ${ARNS_NETWORK:-devnet}
      # Node's default heap target assumes it owns the machine. This box is a
      # 1GB nanode running six containers.
      NODE_OPTIONS: --max-old-space-size=384
    expose: ['3300', '3400']
    volumes:
      - store_data:/data
    healthcheck:
      test: ['CMD-SHELL', 'wget -q --spider http://localhost:3400/health || exit 1']
      interval: 30s
      timeout: 10s
      retries: 5
      start_period: 20s
    restart: unless-stopped

  # ── The TLS edge ───────────────────────────────────────────────────────────
  # Deliberately NOT Watchtower-labelled. nginx holds the resolver that lets
  # every other container survive being recreated at a new address; recreating
  # it on an upstream nginx:alpine push would be an unreviewed change to the
  # one component whose job is to outlive the others.
  nginx:
    image: nginx:alpine
    ports:
      - '80:80'
      - '443:443'
    volumes:
      - ./nginx/conf.d:/etc/nginx/conf.d:ro
      - certbot_conf:/etc/letsencrypt:ro
      - certbot_www:/var/www/certbot:ro
    command: >
      sh -c "while :; do sleep 6h & wait $${!}; nginx -s reload; done & nginx -g 'daemon off;'"
    restart: unless-stopped

  # Holds the renewal timer; not Watchtower-labelled, same reasoning.
  certbot:
    image: certbot/certbot
    volumes:
      - certbot_conf:/etc/letsencrypt
      - certbot_www:/var/www/certbot
    entrypoint: >
      sh -c "trap exit TERM; while :; do certbot renew --webroot -w /var/www/certbot --quiet; sleep 12h & wait $${!}; done"
    restart: unless-stopped

  # ── Unattended updates ─────────────────────────────────────────────────────
  # `--label-enable` means it ignores every container that does not carry the
  # enable label, so it only ever touches connector, store and announce.
  # Pinned, rather than floating on :latest — otherwise a future Watchtower
  # release changes this box's deploy behaviour with nothing in git to point at
  # (which is exactly the defect it exists to fix for everything else).
  # Not labelled itself.
  watchtower:
    image: containrrr/watchtower:1.7.1
    environment:
      DOCKER_API_VERSION: '1.44'
    command: ['--label-enable', '--interval', '60', '--cleanup']
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock
    restart: unless-stopped

volumes:
  # The claim watermark. Back this up; losing it hands every payer their
  # already-spent claims back as free service.
  connector_state:
  store_data:
  certbot_conf:
  certbot_www:
