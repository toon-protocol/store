# =============================================================================
# store deploy — connector (payment proxy) + Arweave store backend. NO Caddy.
# =============================================================================
# The connector monetizes the kind:5094 blob-storage job; the store backend is
# payment-oblivious. TLS is terminated by the deployment environment, which
# reverse-proxies to the host-published edge (:3000).
#
#   payer ──POST /ilp──▶ connector ──POST /store──▶ store:3300  (store backend; PRIVATE)
#
# PRIVACY INVARIANT (enforced by construction):
#   - store :3300 (store job backend) → NEVER host-published; only connector dials store:3300.
#   - store :3400 (health) → NEVER host-published.
#   The only host-bound port is the edge :3000. The connector has no other port
#   to leak: since the move to the Rust connector its edge, operator surface and
#   /metrics all share :3000, and the TypeScript node's :8080/:8081 are gone.
#
# ⚠ DOCKER'S `ports:` PUBLISH BYPASSES ufw. Docker inserts its own rules into
#   the DOCKER-USER/FORWARD iptables chains ahead of ufw's, so a `ports:` entry
#   is reachable from the internet no matter what `ufw status` reports — a
#   host firewall rule does NOT make a published port private. That is why
#   every `ports:` entry below is prefixed with a host interface (127.0.0.1)
#   instead of a bare port, which binds it to loopback and makes it reachable
#   ONLY through the box's own reverse proxy / TLS terminator, not the network.
#   Never "fix" an exposure here by adding a ufw rule — change the bind.
#
# Dev:  docker compose up --build   (builds store-connector locally from ./Dockerfile)
# Prod: docker compose up           (pulls the pinned STORE_CONNECTOR_IMAGE)
# =============================================================================

services:
  # ── The payment proxy (connector + baked store route config) ────────────────
  connector:
    image: ${STORE_CONNECTOR_IMAGE:-ghcr.io/toon-protocol/store-connector:latest}
    build:
      context: .
      dockerfile: Dockerfile
      args:
        CONNECTOR_TAG: ${CONNECTOR_TAG:-rust-sha-440eab7}
    # NO `environment:` block, deliberately. The Rust connector has no
    # environment-variable layer at all (connector#755): every value comes from
    # the baked ./connector.toml, so there is exactly one place any value comes
    # from. The three variables that used to live here are all gone —
    # CONFIG_FILE (the image's CMD already names the path), TOON_MNEMONIC (the
    # settlement key is a mounted FILE now, derived outside the container), and
    # NODE_TLS_REJECT_UNAUTHORIZED (a Node.js escape hatch with no equivalent;
    # a self-signed RPC cert is now a hard TLS failure, so point the config at
    # an RPC with a real chain of trust).
    volumes:
      # Two key files, provisioned two DIFFERENT ways — see ./connector.toml.
      # In short: the signer is this node's ILP identity and holds no money, so
      # it is fresh random material per box; the settlement key spends real
      # testnet value and is the identity clients open their channels against,
      # so it is derived from a seed you can reproduce. Both must exist and be
      # readable by uid 10001 before the first `up -d` — a bind mount keeps its
      # HOST ownership inside the container, so `chown 10001:10001` them or the
      # container restart-loops on "Permission denied".
      - ./signer.key:/app/data/signer.key:ro
      - ./settlement.key:/app/data/settlement.key:ro
      # The durable claim journal (connector#605). NAMED, not a host bind: the
      # image ships /app/state owned by uid 10001, which is what a fresh named
      # volume inherits on first mount and what a bind mount does not. Replaying
      # this journal is what makes a channel's replay watermark survive a
      # restart; without it, every claim a payer already spent becomes free
      # service again.
      - connector_state:/app/state
    ports:
      # Host-IP-bound, matching the live fleet (127.0.0.1 behind nginx) — a
      # bare '3000:3000' publishes on 0.0.0.0 and is internet-reachable
      # regardless of ufw (see the warning above). Override EDGE_BIND if this
      # box's reverse proxy runs somewhere other than loopback.
      - '${EDGE_BIND:-127.0.0.1}:${EDGE_PORT:-3000}:3000' # paid POST /ilp edge (the env's TLS terminator fronts this)
    # No `expose: 8080`. The client edge, the operator surface and /metrics all
    # share :3000 on the Rust connector; the TypeScript node's separate health
    # (:8080) and admin (:8081) ports do not exist.
    depends_on:
      store:
        condition: service_healthy
    restart: unless-stopped

  # ── The Arweave store (payment-oblivious HTTP backend) ───────────────────────
  # Published store image: it serves the plain-HTTP POST /store backend that the
  # connector reverse-proxies to (RouteTermination). The job port (3300) and
  # health (3400) are NOT published — only the connector dials store:3300 over the
  # compose network, enforcing the privacy invariant.
  store:
    image: ${STORE_IMAGE:-ghcr.io/toon-protocol/store:latest}
    environment:
      NODE_NOSTR_SECRET_KEY: ${STORE_NOSTR_SECRET_KEY:?set STORE_NOSTR_SECRET_KEY in .env (64-char hex)}
      HANDLER_PORT: '3300' # POST /store job backend — PRIVATE
      BLS_PORT: '3400' # health — internal
      FEE_PER_JOB: ${FEE_PER_JOB:-10} # informational (connector enforces the flat route price)
      # Arweave wallet: base64(JSON JWK). Empty → ephemeral free-tier (≤100KB).
      STORE_ARWEAVE_JWK_B64: ${STORE_ARWEAVE_JWK_B64:-}
      # The optional kind:5095/5096/5098 jobs (see entrypoint-store.ts's env
      # mapping). All pass through empty by default, which the store treats
      # identically to unset (job disabled) — so enabling one is ONE edit,
      # setting it in .env, not also uncommenting a line here.
      ARNS_DVM_SOLANA_SECRET_KEY: ${ARNS_DVM_SOLANA_SECRET_KEY:-}
      ARNS_NETWORK: ${ARNS_NETWORK:-devnet}
      GAS_STATION_SOLANA_SECRET_KEY: ${GAS_STATION_SOLANA_SECRET_KEY:-}
      GAS_STATION_CHANNEL_PROGRAM_ID: ${GAS_STATION_CHANNEL_PROGRAM_ID:-}
      EVM_GAS_STATION_CONFIG_JSON: ${EVM_GAS_STATION_CONFIG_JSON:-}
      EVM_GAS_STATION_QUOTE_TTL_MS: ${EVM_GAS_STATION_QUOTE_TTL_MS:-}
      EVM_GAS_STATION_MAX_GAS: ${EVM_GAS_STATION_MAX_GAS:-}
    expose:
      - '3300' # store job backend — PRIVATE (only the connector dials store:3300)
      - '3400' # health — internal
    healthcheck:
      test: ['CMD-SHELL', 'wget -q --spider http://localhost:3400/health || exit 1']
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 10s
    restart: unless-stopped

volumes:
  # The claim journal. Named so a fresh mount inherits the image's uid-10001
  # ownership of /app/state; see the connector service's `volumes:` above for
  # why it must outlive the container.
  connector_state:

networks:
  default:
    name: store_deploy_net
