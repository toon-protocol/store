name: Publish store-connector image

# Builds the store-connector image (deploy/Dockerfile: the published TOON
# connector with this repo's deploy/connector.toml baked in) and pushes it to
# GHCR. This is the payment-proxy image that runs in front of the store app
# (RouteTermination: route g.toon.ario -> http://store:3300/store).
#
# The store app image is published separately (publish-store-image.yml ->
# ghcr.io/toon-protocol/store). This image bakes a PINNED connector
# (CONNECTOR_TAG); bump it deliberately to adopt a newer connector.
#
# This workflow deliberately does NOT pass its own --build-arg: doing so used
# to make it a fourth copy of the literal, when deploy/Dockerfile's own ARG
# default already decides what an un-overridden build produces. Omitting it
# here means this job always publishes whatever deploy/Dockerfile pins — one
# fewer place to keep in lockstep, not one more. Three copies now decide a
# tag: deploy/Dockerfile's ARG default (the source of truth, and what this
# workflow publishes), deploy/docker-compose.yml's build-arg default (local
# `docker compose up --build`), and deploy/.env.example (what an operator
# copies into `.env` to override either build without editing tracked files).
# deploy/README.md quotes that default in prose as a fourth mention that sets
# nothing; src/deploy-bundle-guard.test.ts holds all four in lockstep and
# fails the gate on any that drifts. Since connector#755 it names a Rust build
# (`rust-sha-<short>`); a plain semver tag is the retired TypeScript node,
# which reads YAML and cannot start on deploy/connector.toml.
#
# `latest` is (re)published on every push to main; version tags (vX.Y.Z) also
# publish semver tags for pinning, plus an immutable sha tag.

on:
  push:
    branches: [main]
    tags: ['v*']
  workflow_dispatch:

concurrency: publish-store-connector-image-${{ github.ref }}

jobs:
  build-push:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v4

      - uses: docker/setup-buildx-action@v3

      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Derive image metadata
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ghcr.io/${{ github.repository_owner }}/store-connector
          tags: |
            type=raw,value=latest,enable={{is_default_branch}}
            type=semver,pattern={{version}}
            type=semver,pattern={{major}}.{{minor}}
            type=sha

      - name: Build and push
        uses: docker/build-push-action@v6
        with:
          context: deploy
          file: deploy/Dockerfile
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
