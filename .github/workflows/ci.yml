name: CI

on:
  pull_request:
    # The no-op merge guard's triggers, and so the whole workflow's: the three
    # defaults plus `ready_for_review`. `synchronize` is what catches a PR that
    # becomes a no-op after its branch is updated.
    types: [opened, synchronize, reopened, ready_for_review]
  push:
    branches: [main]

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Record gate start time
        id: gate_start
        run: echo "seconds=$(date +%s)" >> "$GITHUB_OUTPUT"

      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4
        with:
          version: 8.15.9

      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: 'pnpm'

      - run: pnpm install --frozen-lockfile

      # build/typecheck/lint/test are independent of each other (build doesn't
      # consume typecheck's output, vitest runs against src/ not dist/, lint is
      # standalone), so run them concurrently instead of as sequential steps to
      # cut gate wall-clock. Each still surfaces its own pass/fail clearly.
      - name: Build, typecheck, lint, and test (parallel)
        run: |
          set +e
          declare -A pid
          for step in build typecheck lint test; do
            pnpm "$step" > "/tmp/$step.log" 2>&1 &
            pid[$step]=$!
          done

          failed=""
          for step in build typecheck lint test; do
            wait "${pid[$step]}"
            status=$?
            echo "::group::pnpm $step"; cat "/tmp/$step.log"; echo "::endgroup::"
            [ "$status" -ne 0 ] && failed="$failed $step"
          done

          if [ -n "$failed" ]; then
            echo "::error::gate failed:$failed"
            exit 1
          fi

      - name: Enforce gate no-regression guard
        run: |
          end=$(date +%s)
          elapsed=$(( end - ${{ steps.gate_start.outputs.seconds }} ))
          echo "Gate wall-clock: ${elapsed}s"
          GATE_WALL_CLOCK_SECONDS="$elapsed" npx tsx src/gate-regression-guard.ts

  devbox-validate:
    name: Devbox Environment Validation
    runs-on: ubuntu-latest
    if: github.event_name == 'push' || github.event_name == 'pull_request'
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Install devbox
        uses: jetify-com/devbox-install-action@v0.15.0
        with:
          enable-cache: true

      - name: Assert tool versions
        run: |
          cat > "${RUNNER_TEMP:-/tmp}/assert-versions.sh" <<'ASSERT'
          set -euo pipefail
          node --version | grep -E '^v22\.'
          pnpm --version | grep -E '^8\.15\.'
          ASSERT
          devbox run -- bash "${RUNNER_TEMP:-/tmp}/assert-versions.sh"
          echo "✅ All devbox tools resolved at expected versions"

      - name: Smoke build
        run: devbox run -- bash -c "pnpm install --frozen-lockfile && pnpm build"

  # No-op merge guard: a PR whose merge result changes zero files must not
  # merge green (connector#1008 did, as an empty squash commit). Brought in
  # from toon-meta's reusable empty-pr-guard.yml so CI does not depend on
  # toon-meta; the logic is .github/scripts/no-op-merge-guard.sh, exercised by
  # src/no-op-merge-guard.test.ts. It feeds the aggregate `CI OK` below, the
  # repo's one required check. No `if:` -- on push the script passes plainly,
  # and a skipped gating job must never read as a pass.
  no-op-merge:
    name: No-op merge guard
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      # The script reads the merge commit and both parents (depth 2); 3 is slack.
      - name: Check out the merge result
        uses: actions/checkout@v4
        with:
          fetch-depth: 3

      - name: A merge that changes nothing must not merge green
        env:
          PR_HEAD_SHA: ${{ github.event.pull_request.head.sha }}
          PR_BASE_REF: ${{ github.event.pull_request.base.ref }}
          PR_NUMBER: ${{ github.event.pull_request.number }}
          # GitHub's three-dot "Files changed" count, from the event payload.
          PR_CHANGED_FILES: ${{ github.event.pull_request.changed_files }}
        run: .github/scripts/no-op-merge-guard.sh

  # Aggregate required check for the repo: fails unless EVERY gating job above
  # succeeded. `if: always()` + explicit result checks mean a skipped or
  # cancelled gating job never reads as a pass (toon-meta#279).
  ci-ok:
    name: CI OK
    runs-on: ubuntu-latest
    needs: [build, devbox-validate, no-op-merge]
    if: always()
    steps:
      - name: Verify all gating jobs succeeded
        run: |
          echo "build: ${{ needs.build.result }}"
          echo "devbox-validate: ${{ needs.devbox-validate.result }}"
          echo "no-op-merge: ${{ needs.no-op-merge.result }}"
          if [ "${{ needs.build.result }}" != "success" ] || \
             [ "${{ needs.devbox-validate.result }}" != "success" ] || \
             [ "${{ needs.no-op-merge.result }}" != "success" ]; then
            echo "::error::CI OK requires every gating job to succeed (failure, cancelled, and skipped all fail)"
            exit 1
          fi
          echo "All gating jobs succeeded"
